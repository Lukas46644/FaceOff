<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaceOff Vollbild</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fog-a:#eef0fb; --fog-b:#dfe3f6; --fog-text:#2b2e4a; --fog-accent:#6f7bd1;
    --disp:'Quicksand', sans-serif; --body:'Karla', -apple-system, 'Segoe UI', sans-serif; --mono:ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{ --fog-a:#141a33; --fog-b:#0d1024; --fog-text:#e6e8fb; --fog-accent:#9aa4e8; }
  }
  *{box-sizing:border-box;}
  html, body{height:100%; margin:0; overflow:hidden;}
  body{
    display:flex; flex-direction:column;
    background:linear-gradient(160deg,var(--fog-a),var(--fog-b));
    color:var(--fog-text); font-family:var(--body);
  }

  /* ---- top bar ---- */
  .topbar{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:14px 20px;}
  .brand{font-family:var(--disp); font-weight:600; font-size:19px;}
  .icon-btn{
    display:flex; align-items:center; gap:8px; font-family:var(--disp); font-weight:600; font-size:13.5px;
    padding:8px 16px; border-radius:99px; background:rgba(255,255,255,.6); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.6); color:var(--fog-text); cursor:pointer;
  }
  .icon-btn svg{width:15px; height:15px;}

  /* ---- main compare area, fills the rest of the screen ---- */
  main{flex:1 1 auto; position:relative; margin:0 16px 16px; border-radius:20px; overflow:hidden;}

  .compare{--pos:50%; position:absolute; inset:0; touch-action:none; cursor:ew-resize; user-select:none;}
  .compare__layer{position:absolute; inset:0;}
  .compare__original{background:linear-gradient(160deg,#f3e7d6,#d8c6a8);}
  .compare__result{background:linear-gradient(160deg,#cfd7f5,#aeb8e8); clip-path:inset(0 0 0 var(--pos));}

  .face-slot{position:absolute; top:24%; left:36%; width:28%; height:46%;}
  .face-slot.original{border-radius:50%; background:radial-gradient(circle at 38% 30%, #e8c39c, #b98a63 70%);}
  .face-slot.original .eye{position:absolute; top:36%; width:9%; height:9%; border-radius:50%; background:#3a2a20;}
  .face-slot.original .eye--l{left:26%;} .face-slot.original .eye--r{left:60%;}
  .face-slot.original .mouth{position:absolute; top:62%; left:30%; width:36%; height:12%; border:2.5px solid #6b3f2a; border-top:none; border-radius:0 0 40px 40px;}
  .face-slot.result{border-radius:10px; background-image:repeating-conic-gradient(from 45deg,#caa07a 0 25%,#8a5a3c 25% 50%,#d8b48f 50% 75%,#5c3a26 75% 100%); background-size:16% 16%;}

  .compare__label{position:absolute; top:16px; font-family:var(--mono); font-size:11px; letter-spacing:.05em; padding:4px 10px; border-radius:99px; background:rgba(255,255,255,.75); color:var(--fog-text);}
  .compare__label--left{left:16px;}
  .compare__label--right{right:16px;}

  .compare__handle{position:absolute; top:0; bottom:0; left:var(--pos); width:0; display:flex; align-items:center; justify-content:center;}
  .compare__handle::before{content:''; position:absolute; top:0; bottom:0; left:-1px; width:2px; background:#fff; box-shadow:0 0 0 1px rgba(43,46,74,.15);}
  .compare__knob{width:44px; height:44px; border-radius:50%; background:#fff; box-shadow:0 8px 18px rgba(43,46,74,.35); display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--fog-accent);}

  /* ---- floating settings bar, overlaid on the image ---- */
  .toolbar{
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:99px;
    background:rgba(255,255,255,.65); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.6);
    box-shadow:0 10px 30px -10px rgba(43,46,74,.4);
    max-width:min(92vw, 620px);
  }
  .pill-row{display:flex; gap:5px;}
  .pill{font-size:12px; padding:7px 13px; border-radius:99px; background:rgba(255,255,255,.6); color:var(--fog-text); opacity:.55; white-space:nowrap; cursor:pointer;}
  .pill--active{background:var(--fog-accent); color:#fff; opacity:1;}
  .toolbar__slider{width:90px; height:4px; border-radius:2px; background:rgba(43,46,74,.15); position:relative; flex:0 0 auto;}
  .toolbar__slider::after{content:''; position:absolute; inset:0; width:60%; border-radius:2px; background:var(--fog-accent);}
  .toolbar__divider{width:1px; align-self:stretch; background:rgba(43,46,74,.12);}
  .toolbar__icon{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--fog-text); cursor:pointer;}
  .toolbar__icon svg{width:17px; height:17px;}

  @media (max-width:640px){
    .toolbar{gap:6px; padding:8px; flex-wrap:wrap; justify-content:center;}
    .toolbar__slider{width:60px;}
  }
</style>
</head>
<body>

  <div class="topbar">
    <span class="brand">FaceOff</span>
    <button class="icon-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>
      Neues Bild
    </button>
  </div>

  <main>
    <div class="compare" data-compare>
      <div class="compare__layer compare__original">
        <div class="face-slot original"><span class="eye eye--l"></span><span class="eye eye--r"></span><span class="mouth"></span></div>
      </div>
      <div class="compare__layer compare__result">
        <div class="face-slot result"></div>
      </div>
      <span class="compare__label compare__label--left">Original</span>
      <span class="compare__label compare__label--right">Verpixelt</span>
      <div class="compare__handle"><div class="compare__knob">⇔</div></div>
    </div>

    <div class="toolbar">
      <div class="pill-row">
        <span class="pill pill--active">Verpixeln</span>
        <span class="pill">Verwischen</span>
        <span class="pill">Verdunkeln</span>
      </div>
      <div class="toolbar__divider"></div>
      <div class="toolbar__slider"></div>
      <div class="toolbar__divider"></div>
      <div class="toolbar__icon" title="Herunterladen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 19h14"/></svg>
      </div>
    </div>
  </main>

<script>
  function initCompare(el) {
    function setPos(clientX) {
      const rect = el.getBoundingClientRect();
      let pct = ((clientX - rect.left) / rect.width) * 100;
      pct = Math.max(0, Math.min(100, pct));
      el.style.setProperty('--pos', pct + '%');
    }
    el.addEventListener('pointerdown', (e) => {
      el.setPointerCapture(e.pointerId);
      setPos(e.clientX);
    });
    el.addEventListener('pointermove', (e) => {
      if (e.buttons !== 1) return;
      setPos(e.clientX);
    });
  }
  document.querySelectorAll('[data-compare]').forEach(initCompare);
</script>
</body>
</html>
